{% extends 'core/base.html' %}
{% block title %}Insurance estimate — SmartCare{% endblock %}
{% block content %}




<!-- Main Section -->
<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-2">
                        Estimate your insurance cost
                    </h2>

                    <p class="text-center text-muted mb-4">
                        Enter your information to estimate insurance charges.
                    </p>


                    <!-- Prediction Form -->
                    <form id="predictionForm">
                        {% csrf_token %}

                        <!-- Age -->
                        <div class="mb-3">
                            <label class="form-label" for="age">
                                Age
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="age"
                                min="1"
                                max="120"
                                required
                            >
                        </div>


                        <!-- Gender -->
                        <div class="mb-3">

                            <label class="form-label" for="sex">
                                Gender
                            </label>

                            <select
                                class="form-select"
                                id="sex"
                                required
                            >
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>

                        </div>


                        <!-- BMI -->
                        <div class="mb-3">

                            <label class="form-label" for="bmi">
                                BMI
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="bmi"
                                step="0.1"
                                min="10"
                                max="100"
                                required
                            >

                        </div>


                        <!-- Children -->
                        <div class="mb-3">

                            <label class="form-label" for="children">
                                Number of Children
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="children"
                                min="0"
                                max="20"
                                required
                            >

                        </div>


                        <!-- Smoker -->
                        <div class="mb-3">

                            <label class="form-label" for="smoker">
                                Smoker
                            </label>

                            <select
                                class="form-select"
                                id="smoker"
                                required
                            >
                                <option value="">
                                    Select Option
                                </option>

                                <option value="yes">
                                    Yes
                                </option>

                                <option value="no">
                                    No
                                </option>

                            </select>

                        </div>


                        <!-- Region -->
                        <div class="mb-4">

                            <label class="form-label" for="region">
                                Region
                            </label>

                            <select
                                class="form-select"
                                id="region"
                                required
                            >

                                <option value="">
                                    Select Region
                                </option>

                                <option value="southwest">
                                    Southwest
                                </option>

                                <option value="southeast">
                                    Southeast
                                </option>

                                <option value="northwest">
                                    Northwest
                                </option>

                                <option value="northeast">
                                    Northeast
                                </option>

                            </select>

                        </div>


                        <!-- Button -->
                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                            id="predictButton"
                        >
                            Get an estimate
                        </button>

                    </form>


                    <!-- Loading -->
                    <div
                        id="loading"
                        class="text-center mt-4 d-none"
                    >

                        <div
                            class="spinner-border text-primary"
                            role="status"
                        ></div>

                        <p class="mt-2">
                            Calculating your estimate...
                        </p>

                    </div>


                    <!-- Result -->
                    <div
                        id="result" role="status" aria-live="polite"
                        class="alert alert-success text-center mt-4 d-none"
                    >

                        <h5>
                            Estimated Insurance Cost
                        </h5>

                        <h2 id="predictionValue">
                            $0.00
                        </h2>

                    </div>


                    <!-- Error -->
                    <div
                        id="error" role="alert"
                        class="alert alert-danger mt-4 d-none"
                    ></div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- JavaScript -->
<script>

const form = document.getElementById("predictionForm");

const result = document.getElementById("result");
const error = document.getElementById("error");
const loading = document.getElementById("loading");
const predictionValue =
    document.getElementById("predictionValue");


form.addEventListener("submit", async function(event) {

    event.preventDefault();


    // Hide previous messages
    result.classList.add("d-none");
    error.classList.add("d-none");

    loading.classList.remove("d-none");


    // Collect form data
    const data = {

        age: parseInt(
            document.getElementById("age").value
        ),

        sex:
            document.getElementById("sex").value,

        bmi: parseFloat(
            document.getElementById("bmi").value
        ),

        children: parseInt(
            document.getElementById("children").value
        ),

        smoker:
            document.getElementById("smoker").value,

        region:
            document.getElementById("region").value
    };


    try {

        const response = await fetch(
            "{% url 'predict' %}",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",
                    "X-CSRFToken": form.querySelector('[name="csrfmiddlewaretoken"]').value
                },

                body: JSON.stringify(data)
            }
        );


        const responseData =
            await response.json();


        if (!response.ok) {

            throw new Error(
                JSON.stringify(responseData)
            );

        }


        // Show prediction
        predictionValue.textContent =
            "$" +
            Number(
                responseData.predicted_charge
            ).toLocaleString(
                "en-US",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );


        result.classList.remove("d-none");


    } catch (err) {

        error.textContent =
            "Something went wrong. Please check your input and try again.";

        error.classList.remove("d-none");

        console.error(err);

    } finally {

        loading.classList.add("d-none");

    }

});

</script>

{% endblock %}
