  </g>
  <!-- Rocket Logotype -->
  <g transform="translate(62, 39)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="22" fill="#6A1B9A" letter-spacing="-0.3">Rocket</text>
  </g>
