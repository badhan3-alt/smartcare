<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" width="160" height="60">
  <defs>
    <linearGradient id="nagadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7941D"/>
      <stop offset="50%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#C11119"/>
    </linearGradient>
  </defs>
  <!-- Background Pill -->
  <rect x="2" y="2" width="156" height="56" rx="10" fill="#FFFFFF" stroke="#FCE0D2" stroke-width="1.5"/>
  <!-- Circular Swirl Icon -->
  <g transform="translate(14, 10)">
    <circle cx="20" cy="20" r="18" fill="url(#nagadGrad)"/>
    <!-- Stylized flame / petal curve -->
    <path d="M20,6 C28,6 34,12 34,20 C34,25 31,29 27,31 C24,27 25,21 21,17 C18,14 15,16 13,19 C11,14 15,6 20,6 Z" fill="#FFA333" opacity="0.9"/>
    <!-- Postman / Runner Silhouette in white -->
    <!-- Head -->
    <circle cx="20" cy="14" r="2.2" fill="#FFFFFF"/>
    <!-- Torso & lantern sack -->
    <path d="M18,17 L22,17 L23,22 L17,22 Z" fill="#FFFFFF"/>
    <path d="M15,18 L18,18 L17,23 L14,21 Z" fill="#FFFFFF" opacity="0.95"/> <!-- Mail bag -->
    <line x1="14" y1="16" x2="26" y2="21" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/> <!-- Stick -->
    <rect x="13.5" y="21" width="2" height="3" fill="#FFFFFF" rx="0.5"/> <!-- Lantern -->
    <!-- Running legs -->
    <path d="M18,22 L15,28 L17,28.5 L19,24 L22,25 L24,29 L26,28.5 L23,23 Z" fill="#FFFFFF"/>
  </g>
  <!-- Nagad Logotype -->
  <g transform="translate(60, 39)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="23" fill="#ED1C24" letter-spacing="-0.5">Nagad</text>
  </g>
</svg>
