{% extends 'core/base.html' %}

{% block title %}Reset Password - SmartCare{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="navbar-brand-logo mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold">Reset Your Password</h3>
                    <p class="text-muted small">Enter the six-digit code from your email and choose a new password.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold" for="code">Reset Code</label>
                        <input type="text" name="code" id="code" class="form-control"
                               inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                               placeholder="Enter 6-digit code" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold" for="password">New Password</label>
                        <input type="password" name="password" id="password" class="form-control"
                               minlength="8" placeholder="Create a new password" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold" for="confirm_password">Confirm New Password</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control"
                               minlength="8" placeholder="Confirm your new password" required>
                    </div>
                    <button type="submit" class="btn btn-primary-sc w-100 py-2">
                        <i class="bi bi-check2-circle me-1"></i> Reset Password
                    </button>
                </form>
                <div class="text-center small mt-4">
                    <a href="{% url 'accounts:forgot_password' %}" style="color: var(--sc-primary);">Request a new code</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
