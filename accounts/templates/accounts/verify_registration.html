{% extends 'core/base.html' %}

{% block title %}Verify Registration - SmartCare{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="navbar-brand-logo mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                        <i class="bi bi-envelope-check-fill"></i>
                    </div>
                    <h3 class="fw-bold">Verify Your Email</h3>
                    <p class="text-muted small">Enter the six-digit code sent to your email to activate your account.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <label class="form-label small fw-bold" for="code">Verification Code</label>
                    <input type="text" name="code" id="code" class="form-control mb-3"
                           inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                           placeholder="Enter 6-digit code" required autofocus>
                    <button type="submit" class="btn btn-primary-sc w-100 py-2">
                        <i class="bi bi-check2-circle me-1"></i> Verify Account
                    </button>
                </form>
                <div class="text-center small mt-4">
                    <a href="{% url 'register' %}" style="color: var(--sc-primary);">Register again</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
