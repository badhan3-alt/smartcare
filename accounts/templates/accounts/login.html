{% extends 'core/base.html' %}

{% block title %}Sign In - SmartCare{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="navbar-brand-logo mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                        <i class="bi bi-heart-pulse-fill"></i>
                    </div>
                    <h3 class="fw-bold">Sign In to SmartCare</h3>
                    <p class="text-muted small">Manage your healthcare appointments and live queues</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control border-start-0" placeholder="Enter your username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control border-start-0" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-sc w-100 py-2 mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <div class="text-center small mt-3">
                    <a href="{% url 'accounts:forgot_password' %}" class="text-muted">Forgot your password?</a>
                </div>

                <div class="text-center small mt-4 pt-3 border-top">
                    Don't have an account? <a href="{% url 'register' %}" class="fw-semibold text-teal" style="color: var(--sc-primary);">Create an Account</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
