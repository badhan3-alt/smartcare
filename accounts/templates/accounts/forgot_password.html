{% extends 'core/base.html' %}

{% block title %}Forgot Password - SmartCare{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="navbar-brand-logo mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                        <i class="bi bi-envelope-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold">Forgot Password?</h3>
                    <p class="text-muted small">Enter your account email and we will send you a reset code.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <label class="form-label small fw-bold" for="email">Email Address</label>
                    <input type="email" name="email" id="email" class="form-control mb-3"
                           placeholder="Enter your email address" required autofocus>
                    <button type="submit" class="btn btn-primary-sc w-100 py-2">
                        <i class="bi bi-send me-1"></i> Send Reset Code
                    </button>
                </form>
                <div class="text-center small mt-4">
                    <a href="{% url 'login' %}" class="fw-semibold" style="color: var(--sc-primary);">Back to Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
